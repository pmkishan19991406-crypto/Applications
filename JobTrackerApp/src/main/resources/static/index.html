<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Job Application Tracker</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 15px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #1f2937;
            color: white;
        }

        input,
        select {
            padding: 9px;
            margin: 5px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }

    </style>

</head>


<body>


    <!-- Header -->

    <div style="
        background:#1f2937;
        color:white;
        padding:25px;
        text-align:center;
    ">

        <h1>Job Application Tracker</h1>

        <p>
            Track your applications, interviews and job opportunities
        </p>

    </div>



    <!-- Dashboard -->

    <div class="card">

        <h2>Dashboard</h2>

        <div style="
            display:flex;
            gap:15px;
            flex-wrap:wrap;
        ">


            <!-- Total -->

            <div style="
                background:#e3f2fd;
                padding:20px;
                min-width:150px;
                text-align:center;
                border-radius:6px;
            ">

                <h3>Total Applications</h3>

                <h2 id="totalCount">0</h2>

            </div>



            <!-- Applied -->

            <div style="
                background:#fff3cd;
                padding:20px;
                min-width:150px;
                text-align:center;
                border-radius:6px;
            ">

                <h3>Applied</h3>

                <h2 id="appliedCount">0</h2>

            </div>



            <!-- Interview -->

            <div style="
                background:#d1ecf1;
                padding:20px;
                min-width:150px;
                text-align:center;
                border-radius:6px;
            ">

                <h3>Interview</h3>

                <h2 id="interviewCount">0</h2>

            </div>



            <!-- Offers -->

            <div style="
                background:#d4edda;
                padding:20px;
                min-width:150px;
                text-align:center;
                border-radius:6px;
            ">

                <h3>Offers</h3>

                <h2 id="offerCount">0</h2>

            </div>


        </div>

    </div>



    <!-- Search and Filter -->

    <div class="card">

        <h2>Search & Filter</h2>


        <input
            type="text"
            id="searchCompany"
            placeholder="Search company"
        >


        <button
            onclick="searchApplications()"
        >
            Search
        </button>



        <select
            id="statusFilter"
            onchange="filterByStatus()"
        >

            <option value="">
                All Status
            </option>

            <option value="APPLIED">
                APPLIED
            </option>

            <option value="INTERVIEW">
                INTERVIEW
            </option>

            <option value="OFFER">
                OFFER
            </option>

            <option value="REJECTED">
                REJECTED
            </option>

        </select>



        <button
            onclick="loadApplications()"
        >
            Show All
        </button>

    </div>



    <!-- Add / Update Application -->

    <div class="card">

        <h2>Job Application</h2>


        <input
            type="text"
            id="companyName"
            placeholder="Company Name"
        >


        <input
            type="text"
            id="jobRole"
            placeholder="Job Role"
        >


        <input
            type="text"
            id="location"
            placeholder="Location"
        >


        <input
            type="number"
            id="salary"
            placeholder="Salary"
        >


        <select id="applicationStatus">

            <option value="APPLIED">
                APPLIED
            </option>

            <option value="INTERVIEW">
                INTERVIEW
            </option>

            <option value="OFFER">
                OFFER
            </option>

            <option value="REJECTED">
                REJECTED
            </option>

        </select>


        <input
            type="date"
            id="appliedDate"
        >


        <input
            type="date"
            id="followUpDate"
        >


        <button
            id="saveButton"
            onclick="addApplication()"
            style="
                background:#1f2937;
                color:white;
            "
        >
            Add Application
        </button>


    </div>



    <!-- Applications Table -->

    <div class="card">

        <h2>Applications</h2>


        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Company</th>

                    <th>Role</th>

                    <th>Location</th>

                    <th>Salary</th>

                    <th>Status</th>

                    <th>Applied Date</th>

                    <th>Follow Up</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="applicationTable">

            </tbody>

        </table>

    </div>



    <!-- JavaScript -->

    <script src="js/app.js"></script>


</body>

</html>
